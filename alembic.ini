# Alembic configuration for KRYVARACODE.
# The database URL is resolved at runtime from src.core.config.settings
# (see alembic/env.py) so a single config works for dev/test/prod.

[alembic]
script_location = alembic
prepend_sys_path = .

# Path to a template file for new revision files.
file_template = %%(rev)s_%%(slug)s

# Timezone to use when writing new revision files.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S