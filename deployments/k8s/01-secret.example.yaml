# KRYVARACODE — secrets EXAMPLE.
#
# Copy this file to 01-secret.yaml and replace the placeholder base64 values
# with real generated values BEFORE applying:
#   $env:DATABASE_URL  ->  [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($env:DATABASE_URL))
#   SECRET_KEY / JWT_SECRET_KEY -> `python -c "import secrets; print(secrets.token_urlsafe(48))"` then base64-encode.
#
# Never commit the real 01-secret.yaml. In production prefer an external
# secrets manager (Vault, cloud KMS, sealed-secrets) over a committed Secret.
apiVersion: v1
kind: Secret
metadata:
  name: kryvaracode-secret
  labels:
    app: kryvaracode
type: Opaque
stringData:
  DATABASE_URL: "postgresql://kryvaracode:CHANGE_ME@postgres:5432/kryvaracode"
  REDIS_URL: "redis://redis:6379/0"
  SECRET_KEY: "CHANGE_ME_generate_a_random_secret"
  JWT_SECRET_KEY: "CHANGE_ME_generate_a_random_jwt_secret"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "CHANGE_ME_minio_secret"