name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: Syntax check
        run: python -m compileall -q src tests

      - name: Run ruff linter
        run: ruff check src/ tests/

      - name: Run mypy type checker
        run: mypy src/

      - name: Run bandit security scan
        run: bandit -r src/

      - name: Run tests with coverage
        env:
          DATABASE_URL: sqlite://
          APP_ENV: test
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Verify alembic migration applies
        env:
          DATABASE_URL: sqlite:///ci_alembic.db
        run: |
          pip install alembic>=1.12 2>/dev/null || true
          alembic upgrade head
          alembic current

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MCP server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/mcp:latest
            ghcr.io/${{ github.repository }}/mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max