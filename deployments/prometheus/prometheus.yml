global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kryvaracode-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/api/v1/metrics'
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/api-bearer-token

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']