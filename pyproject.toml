[project]
name = "kryvaracode"
version = "1.0.0"
description = "KRYVARACODE — AI prediction engine"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "F",      # Pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function call in default argument (FastAPI Depends)
    "N802",   # function name should be lowercase (some existing APIs)
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "SIM105", # use contextlib.suppress (debateable)
    "UP007",  # use X | Y for union types (keep Optional for FastAPI compat)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ are re-exports
"tests/**" = ["B011", "B017", "SIM300"]  # tests: assert True patterns + broad exception assertions
"tests/conftest.py" = ["E402"]  # sys.path + env setup must precede src imports
"tests/test_mcp_integration.py" = ["E402"]  # sys.path setup required
"tests/test_mcp_server.py" = ["E402"]  # pytest.importorskip before src imports
"tests/test_fuzz.py" = ["E402"]  # pytest.importorskip + sys.path setup before src imports
"src/cli/main.py" = ["E402"]  # sys.path setup for `python -m src.cli` invocations

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
