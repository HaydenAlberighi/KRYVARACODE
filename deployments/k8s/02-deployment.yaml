# KRYVARACODE — API deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kryvaracode-api
  labels:
    app: kryvaracode
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kryvaracode
      tier: api
  template:
    metadata:
      labels:
        app: kryvaracode
        tier: api
    spec:
      containers:
        - name: api
          image: ghcr.io/kryvaracode/kryvaracode:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kryvaracode-config
            - secretRef:
                name: kryvaracode-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}